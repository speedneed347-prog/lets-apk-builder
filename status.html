<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Live build status"><title>Build Status — Let-S APK Builder</title><link rel="stylesheet" href="assets/style.css?v=20"></head><body>
<header class="nav"><div class="brand">Let-S <span>APK Builder</span></div><nav><a href="index.html">Home</a><a href="build.html">Build</a><a href="builds.html">My Builds</a><a href="downloads.html">Downloads</a><a href="admin-login.html" id="adminNavLink">Admin</a></nav></header>
<main class="container container-wide"><div class="page-head"><div><h1>Build status</h1><p id="buildIdLabel">Loading…</p></div><a class="btn secondary" href="builds.html">← History</a></div>
<div id="message"></div><div class="card status-card"><div class="status-top"><span id="statusPill" class="pill queued">queued</span><span id="timer" class="timer">0s</span></div><div class="progress"><div id="progressBar"></div></div><div class="current-step" id="currentStep">Waiting for build worker…</div><div class="step-list" id="stepList"></div></div>
<div class="grid-2"><div class="card"><h3>📜 Live logs</h3><pre id="logBox" class="log-box">Connecting…</pre></div><div class="card"><h3>📦 Artifact</h3><div id="artifactBox"><div class="empty-state">Waiting for completion.</div></div></div></div>
<div class="card"><h3>🕘 Build history</h3><div id="historyBox"><div class="empty-state">Loading…</div></div></div></main>
<script src="assets/app.js?v=20"></script><script>
const id=qs("buildId"),els={id:document.getElementById("buildIdLabel"),pill:document.getElementById("statusPill"),timer:document.getElementById("timer"),bar:document.getElementById("progressBar"),step:document.getElementById("currentStep"),steps:document.getElementById("stepList"),logs:document.getElementById("logBox"),artifact:document.getElementById("artifactBox"),history:document.getElementById("historyBox"),msg:document.getElementById("message")};
const names=["Queued","Project generation","Gradle build","Signing","Uploading artifact","Completed"],pct={queued:5,building:45,signing:72,uploading:90,completed:100,failed:100};
let started=null,ended=null,timerId=null,pollId=null,source=null,last=null,artifacts=[];
const esc=x=>escapeHtml(x), cls=s=>["queued","building","signing","uploading","completed","failed"].includes(s)?s:"queued";
function renderSteps(index,status){const n=status==="completed"?names.length:Math.max(0,Math.min(names.length-1,Number(index)||0));els.steps.innerHTML=names.map((x,i)=>{const c=i<n?"done":(status==="failed"&&i===n?"failed":i===n?"active":"pending");return`<div class="step ${c}"><span>${c==="done"?"✓":c==="failed"?"✕":i+1}</span><b>${esc(x)}</b></div>`}).join("")}
function tick(){if(started)els.timer.textContent=formatDuration((ended||new Date())-started)}
function renderArtifact(b){const type=artifactLabel(b.artifactType||b.config?.buildFormat),url=b.artifactUrl||b.apkUrl,a=artifacts[0]||{};if(b.status!=="completed"||!url){els.artifact.innerHTML='<div class="empty-state">Artifact will appear when the build completes.</div>';return}els.artifact.innerHTML=`<div class="artifact-card"><div class="artifact-icon">${type==="AAB"?"🚀":"📦"}</div><div class="artifact-info"><strong>${esc(b.artifactFileName||a.fileName||type)}</strong><span>${type} · ${esc(formatBytes(b.artifactSizeBytes||a.sizeBytes))}</span><span class="hash">SHA-256: ${esc(b.artifactSha256||a.sha256||"—")}</span></div><a class="btn success-btn" href="${esc(api.downloadUrl(b.id))}">⬇ Download ${type}</a></div><p class="direct-link"><a href="${esc(url)}" target="_blank" rel="noopener">Open release URL</a></p>`}
function render(b){last=b;els.id.textContent="Build ID: "+b.id;els.pill.className="pill "+cls(b.status);els.pill.textContent=b.status;els.bar.style.width=(pct[b.status]??10)+"%";els.step.textContent=b.currentStep||"Waiting for worker…";els.logs.textContent=(b.logs||[]).join("\n")||"No logs yet.";if(b.createdAt&&!started){started=new Date(b.createdAt);timerId=setInterval(tick,1000)}if(b.completedAt){ended=new Date(b.completedAt);tick()}renderSteps(b.stepIndex,b.status);renderArtifact(b);els.msg.innerHTML=b.status==="failed"?`<div class="error-box">❌ Build failed: ${esc(b.error||"Unknown error")}</div>`:b.status==="completed"?'<div class="success-box">✅ Build completed successfully.</div>':'<div class="info-box">● Live updates enabled</div>'}
async function extra(){try{artifacts=await api.getBuildArtifacts(id);renderArtifact(last||{})}catch{}try{const h=await api.getBuildHistory(id);els.history.innerHTML=h.length?h.slice().reverse().map(x=>`<div class="history-row"><span class="history-dot"></span><div><b>${esc(x.message||x.type||"Event")}</b><small>${esc(x.status||"")} · ${esc(formatDate(x.at))}</small></div></div>`).join(""):'<div class="empty-state">No history.</div>'}catch(e){els.history.innerHTML=`<div class="empty-state">${esc(e.message)}</div>`}}
async function poll(){try{const b=await api.getBuild(id);render(b);await extra();if(b.status==="completed"||b.status==="failed"){cleanup();return}}catch(e){els.msg.innerHTML=`<div class="error-box">⚠ ${esc(e.message)} — retrying…</div>`}pollId=setTimeout(poll,5000)}
function onEvent(e){try{const d=JSON.parse(e.data||"{}");if(d.status||d.logLine||d.currentStep)api.getBuild(id).then(b=>{render(b);extra()}).catch(()=>{})}catch{}}
function start(){if(!window.EventSource){poll();return}source=new EventSource(api.streamUrl(id));source.onmessage=onEvent;source.addEventListener("build",onEvent);source.onerror=()=>{if(source){source.close();source=null}if(!pollId)pollId=setTimeout(poll,3000)}}
function cleanup(){if(source){source.close();source=null}if(pollId){clearTimeout(pollId);pollId=null}if(timerId){clearInterval(timerId);timerId=null}}
if(!id)els.msg.innerHTML='<div class="error-box">Missing buildId in URL.</div>';else{poll();start()}window.addEventListener("beforeunload",cleanup);
</script></body></html>
